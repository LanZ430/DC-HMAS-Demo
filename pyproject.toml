[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-hmas-demo"
version = "0.1.0"
description = "Public demo — interactive narrative from novel text (DC-HMAS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "streamlit>=1.28.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dc_hmas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
